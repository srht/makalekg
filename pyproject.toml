[project]
name = "kg-bone-brain"
version = "0.1.0"
description = "Kemik–beyin ekseni literatüründen iddia merkezli knowledge graph ve otonom hipotez üretimi"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "lxml>=5.0",
  "pymupdf>=1.24",
  "neo4j>=5.20",
  "anthropic>=1.0",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
embed = ["pykeen>=1.10"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "markdown>=3.6"]
dev = ["pytest>=8"]

[project.scripts]
kg = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli"]
packages = ["kg", "kg.infer", "kg.validate", "kg.web"]

[tool.setuptools.package-data]
"kg.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
