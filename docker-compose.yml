# Dokploy (Docker Compose) ve yerel kullanım için.
# Dokploy: Domains sekmesinde servis "web", port 8000 seçin; Advanced → "Isolated Deployments" açık olsun.
# Gizli değerler Environment sekmesinden gelir (.env).
services:
  web:
    build:
      context: .
      args:
        WITH_EMBED: ${WITH_EMBED:-0}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_USERNAME: ${APP_USERNAME:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD tanımlanmalı}
      APP_SECRET: ${APP_SECRET:-}
      LLM_BACKEND: ${LLM_BACKEND:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      MANUAL_MODEL_NAME: ${MANUAL_MODEL_NAME:-claude.ai}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD tanımlanmalı}
      NEO4J_READ_USER: ${NEO4J_READ_USER:-}
      NEO4J_READ_PASSWORD: ${NEO4J_READ_PASSWORD:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - kg_data:/app/data
      - kg_reports:/app/reports
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    expose:
      - "7687"
      - "7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD tanımlanmalı}
      # Küçük sunucular için düşük varsayılanlar; bu projenin graf boyutu için yeterli
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512M}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512M}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256M}
    volumes:
      - neo4j_data:/data
    # Bolt portu dinlemeye başladı mı? Şifreden bağımsız: şifre değişse veya özel karakter içerse de çalışır.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  kg_data:
  kg_reports:
  neo4j_data:
