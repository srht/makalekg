services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kg-bone-brain-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-please}
      NEO4J_server_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
